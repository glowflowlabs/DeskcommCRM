# DeskcommCRM — stack de produção self-host, MESCLADO para Dokploy.
#
# Este arquivo é a fusão de docker-compose.prod.yml + docker-compose.traefik.yml,
# porque o Dokploy só permite apontar para UM compose. Nada aqui é novo: é o
# mesmo resultado que `docker compose -f prod.yml -f traefik.yml up -d`
# produziria — só que pré-aplicado, arquivo único.
#
# O que veio do override (docker-compose.traefik.yml) e por quê:
#   1. `app` ganhou a rede `proxy` (além de `internal`) e as labels do Traefik,
#      reproduzindo o Caddyfile (rota principal, gzip, bloqueio do webhook
#      global do WAHA, redirect HTTP->HTTPS).
#   2. `caddy` foi posto num profile que nunca é ativado — o Traefik que o
#      Dokploy já roda ocupa as portas 80/443, então o Caddy deste stack não
#      pode subir (dois processos não escutam a mesma porta).
#   3. A rede `proxy` é EXTERNA (`external: true`) — ela já existe, é a rede
#      do Traefik do Dokploy. O nome vem de TRAEFIK_NETWORK no .env; se você
#      não souber o nome exato, rode `docker network ls` no host do Dokploy.
#
# ⚠️ Não rode `docker compose up -d caddy` explicitamente neste arquivo — nomear
# o serviço ativa o profile dele mesmo com COMPOSE_PROFILES vazio, e ele bateria
# de frente com o Traefik do Dokploy nas portas 80/443.
#
#   docker compose -f docker-compose.yml --env-file .env up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"     # rotação: evita que o log encha o disco do VPS
    max-file: "3"

services:
  app:
    # Teto de memória — 335 MiB de pico MEDIDO nesta VPS.
    #
    # Sem ele o contêiner é ilimitado, e numa VPS de 3,8 GB isso não é teoria:
    # um contêiner ALHEIO (agente da hospedagem, fora deste compose) registrou
    # pico de 3.068 MiB no mesmo host. Quando a RAM acaba, o OOM killer escolhe
    # a vítima por PONTUAÇÃO — quem cresceu mais rápido —, não por importância:
    # o que morre pode ser o CRM.
    #
    # O teto não impede o pico legítimo; impede que UM serviço leve a máquina
    # inteira. Estourá-lo mata só quem estourou, e o `restart: unless-stopped`
    # o traz de volta — falha isolada em vez de queda geral.
    mem_limit: 768m
    # Imagem GENÉRICA pré-buildada: o leigo só puxa (sobe em ~2min, roda em 2GB).
    # Os NEXT_PUBLIC_* reais vêm em RUNTIME (env_file abaixo) — o browser lê via
    # <PublicEnvScript/> e o servidor via lib/env.ts. Não precisa buildar no VPS.
    # `:stable` (última release), não `:latest` (topo da `main`). Quem cai neste
    # default é quem NÃO tem APP_IMAGE no .env — avaliação, ou um .env que
    # perdeu a chave. Nenhum desses casos quer código não lançado; quem quiser o
    # topo da main pede `APP_IMAGE=…:latest` explicitamente.
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:stable}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    env_file: .env
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      # Probe TCP puro (node existe na imagem; curl/nc não). NÃO usar /api/v1/health:
      # ele dá 503 se WAHA/Redis caem, o que deixaria o app "unhealthy" e
      # derrubaria o Traefik junto (blackout total por uma dependência secundária).
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

    # ── daqui pra baixo é o que o override de Traefik adiciona ──────────────
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      # Rede onde o Traefik pega o IP do contêiner. Com Traefik em bridge
      # própria (Coolify/Dokploy) OU em modo host (bridge dedicada do
      # install.sh), é sempre a rede `proxy` — nunca `internal`. Medido com
      # Traefik v3.3: apontar para `internal` dá timeout (IP errado), mesmo com
      # o contêiner já conectado nas duas redes.
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"

      # Rota principal — equivale ao `reverse_proxy app:3000` do Caddyfile.
      traefik.http.routers.deskcomm.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.deskcomm.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.deskcomm.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.routers.deskcomm.middlewares: "deskcomm-compress"
      traefik.http.services.deskcomm.loadbalancer.server.port: "3000"

      # `encode gzip` do Caddyfile.
      traefik.http.middlewares.deskcomm-compress.compress: "true"

      # `respond @waha_global 403` do Caddyfile. O webhook GLOBAL do WAHA não
      # pode ser alcançável da internet: quem soubesse o endereço injetaria
      # mensagem falsa no CRM. Como o Traefik não tem "responda 403" direto, o
      # equivalente é um ipallowlist cuja única faixa permitida é
      # 192.0.2.1/32 (TEST-NET-1, RFC 5737) — nenhum cliente real tem esse IP,
      # então toda requisição cai fora da lista e recebe 403. A prioridade alta
      # faz esta rota vencer a principal, que casaria o mesmo Host.
      traefik.http.routers.deskcomm-waha-block.rule: "Host(`${DOMAIN}`) && Path(`/api/v1/webhooks/waha`)"
      traefik.http.routers.deskcomm-waha-block.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.deskcomm-waha-block.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.routers.deskcomm-waha-block.priority: "1000"
      traefik.http.routers.deskcomm-waha-block.service: "deskcomm"
      traefik.http.routers.deskcomm-waha-block.middlewares: "deskcomm-deny"
      traefik.http.middlewares.deskcomm-deny.ipallowlist.sourcerange: "192.0.2.1/32"

      # HTTP -> HTTPS. Sem este router, quem digitar http:// não recebe resposta.
      traefik.http.routers.deskcomm-http.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.deskcomm-http.entrypoints: "${TRAEFIK_ENTRYPOINT_HTTP:-web}"
      traefik.http.routers.deskcomm-http.middlewares: "deskcomm-https"
      traefik.http.routers.deskcomm-http.service: "deskcomm"
      traefik.http.middlewares.deskcomm-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.deskcomm-https.redirectscheme.permanent: "true"


  # Worker 24/7 do agent-engine (fusão Vendaval) — cérebro do agente SDR.
  worker:
    # Teto de memória — 230 MiB de pico MEDIDO nesta VPS. Mesma lógica do `app`
    # (vide comentário acima sobre OOM killer por pontuação).
    mem_limit: 512m
    # Imagem publicada — e não mais `build:` sozinho. Motivo: serviço build-only
    # é PULADO por `docker compose pull` e imune a `up -d` sem `--build`, então o
    # runtime do agente congelava no código do dia da instalação. Com os dois
    # presentes, o Compose usa a imagem quando existe e CONSTRÓI quando não
    # existe — registry fora do ar cai no comportamento antigo em vez de quebrar.
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    pull_policy: ${WORKER_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      # dentro da rede do compose, o WAHA é o serviço 'waha' na porta interna 3000
      WAHA_API_BASE_URL: http://waha:3000
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  waha:
    # Teto de memória — 893 MiB de pico MEDIDO nesta VPS.
    mem_limit: 1280m
    # Core grátis por padrão; troque para devlikeapro/waha-plus via WAHA_IMAGE
    # se precisar de multi-número/retry/S3 (licença paga). Tag PINADA por razão
    # específica: sem tag cairia em `:latest`, entregando qualquer versão nova
    # do upstream no meio de uma atualização do cliente.
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    environment:
      # Prefixo sha512: faz o WAHA HASHEAR o X-Api-Key recebido e comparar com
      # este hash. Sem o prefixo ele compara literal → o app (que manda o
      # plaintext) toma 401.
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha
      # `message` NÃO entra, e `message.any` sozinho não perde nada — medido
      # com dados reais (superconjunto estrito).
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # WAHA lê WHATSAPP_DEFAULT_ENGINE (NÃO WAHA_DEFAULT_ENGINE — nome errado
      # cai no default WEBJS, que trava/corrompe sessão quando o WhatsApp Web
      # atualiza; NOWEB é websocket direto, estável e leve).
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"    # nunca expor o dashboard num template público
      # Sem isto o container volta e as sessões ficam STOPPED: o número
      # continua pareado em /app/.sessions, mas nada entra nem sai até alguém
      # clicar Reconectar. True retoma as que já existiam — não reloga, não
      # pede QR. Default do WAHA é False.
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions          # sessões pareadas (QR) — perder = re-parear
      - waha-media:/app/.media
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # efêmero (rate-limit/debounce)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks: [internal]

  srh:
    # serverless-redis-http: fala o REST do Upstash sobre o redis normal.
    # Pinado por DIGEST, não por tag — `latest` e `0.0.10` NÃO são a mesma
    # imagem, então o digest congela o que já roda em produção hoje.
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  scheduler:
    # Cron sem docker.sock: crond interno batendo curl na rede interna.
    # Resolução de 1 min (paridade com os crons da Vercel). Lista de crons mora
    # em docker/scheduler/entrypoint.sh.
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    pull_policy: ${SCHEDULER_PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    logging: *default-logging
    networks: [internal]

  # ── Chamada de voz WhatsApp (spec 18) — DESLIGADA POR PADRÃO ──────────────
  # Vincula um SEGUNDO APARELHO ao mesmo número que já atende, por caminho não
  # oficial (risco de bloqueio da conta). Fica em profile para não virar padrão.
  # Ligar: `COMPOSE_PROFILES=voz` no .env.
  #
  # ⚠️ Nomear o serviço explicitamente ativa o profile mesmo com
  # COMPOSE_PROFILES vazio. `app`/`worker` NUNCA podem ganhar
  # `depends_on: wacalls` — dependência em profile inativo não sobe e derrubaria
  # o CRM inteiro em toda instalação que não usa a feature.
  wacalls:
    profiles: ["voz"]
    mem_limit: 256m
    image: ${WACALLS_IMAGE:-ghcr.io/jotadev66/wacalls@sha256:9ff52ef9455cf42125a911c38bb8c855f0cc205516cada2054e5c05546909022}
    pull_policy: ${WACALLS_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      WACALLS_ADMIN_USER: ${WACALLS_ADMIN_USER:-}
      WACALLS_ADMIN_PASSWORD: ${WACALLS_ADMIN_PASSWORD:-}
      WACALLS_API_TOKEN: ${WACALLS_API_TOKEN:-}
      WACALLS_CORS_ORIGINS: ${WACALLS_CORS_ORIGINS:-}
      WACALLS_TRUSTED_PROXIES: ${WACALLS_TRUSTED_PROXIES:-}
      WACALLS_PUBLIC_IP: ${WACALLS_PUBLIC_IP:-}
      WACALLS_WEBRTC_UDP_PORT: ${WACALLS_WEBRTC_UDP_PORT:-7881}
    ports:
      # Única porta publicada por um serviço nosso que não é o proxy — UDP, o
      # áudio do WebRTC não fala HTTP. host == contêiner de propósito (o número
      # entra no candidato SDP que o navegador recebe).
      - "${WACALLS_WEBRTC_UDP_PORT:-7881}:${WACALLS_WEBRTC_UDP_PORT:-7881}/udp"
    volumes:
      - wacalls-data:/data
    logging: *default-logging
    networks: [internal]

  # O Traefik do Dokploy já ocupa 80/443, então o Caddy deste stack fica num
  # profile que nunca é ligado (mesmo mecanismo do `wacalls` acima). Ele
  # permanece definido aqui só para não quebrar quem eventualmente reusar este
  # arquivo sem o Dokploy — não rode `up -d caddy` neste ambiente.
  caddy:
    profiles: ["caddy-nao-usado-com-proxy-externo"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

volumes:
  waha-data:
  waha-media:
  wacalls-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge

  # EXTERNA: quem cria esta rede não é este compose — é o Traefik do Dokploy.
  # Se o nome não bater com o que o Dokploy usa, o `up -d` falha ANTES de criar
  # qualquer contêiner ("network X declared as external, but could not be
  # found"). Confirme o nome real com `docker network ls` no host e ajuste
  # TRAEFIK_NETWORK no .env se necessário.
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"